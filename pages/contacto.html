<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- -------------------- fuente elegida de google fonts -------------------- -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- ------------------------- nuestro css externo va como último link ------------------------- -->
    <link rel="stylesheet" href="../css/styles.css" />  
    <title>MiauShop | Contacto</title>
    
</head>
<body>
    <header>
        <div class="div-logo"><a class="logo" href="../index.html">LOGO</a></div>
        <nav class="header-nav">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
                <li><a href="./carrito.html">Carrito</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contacto">
            <h1 class="titulo-contacto text-secondary">Contactanos</h1>
            <form class="form-contacto" action="" method="POST">
                <div class="grupo-input">
                    <label for="email">Aquí su correo electrónico</label>
                    <input id="email" type="email" name="email" />
                </div>

                <div class="grupo-input">
                    <label for="mensaje">Ingrese su mensaje</label>
                    <textarea id="mensaje" name="mensaje"></textarea>
                </div>
                <!-- aqui el form -->
                <button class="btn bg-secondary text-dark" type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Sitio realizado por Luis para Talento Tech</p>
        <nav>
            <ul class="footer-list">
                <li>
                    <img src="../img/whatsapp.png" alt="logo whatsapp" />
                    <img src="../img/instagram.png" alt="logo instagram" />
                </li>
            </ul>
        </nav>
    </footer>
</body>
</html>
