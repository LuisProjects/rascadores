<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <!-- -------------------- fuente elegida de google fonts -------------------- -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" sizes="64x64" href="../img/favicon.png">

    <!-- ------------------------- nuestro css externo va como último link ------------------------- -->
    <link rel="stylesheet" href="../css/styles.css" />  
    <title>MiauShop | Carrito</title>
    
</head>
<body>
    <header>
        <div class="div-logo">
            <a class="logo" href="../index.html" aria-label="MiauShop - Inicio">
                <img class="logo-img" src="../img/logo-opcion-1.webp" alt="MiauShop">
            </a>
        </div>
        <nav class="header-nav">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
                <li><a href="./carrito.html">Carrito <span id="contador-carrito" class="carrito-contador">0</span></a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="carrito-seccion">
            <h1>Carrito de compras</h1>
            <div class="carrito-contenido">
                <ul id="lista-carrito" class="carrito-lista"></ul>
                <p id="carrito-vacio" class="carrito-vacio">
                    Tu carrito está vacío. Volvé al inicio y elegí tu rascador favorito.
                </p>
                <p id="mensaje-carrito" class="mensaje-carrito" role="status" aria-live="polite"></p>
                <div class="carrito-footer">
                    <p class="carrito-total">Total: $<span id="total-carrito">0</span></p>
                    <div class="carrito-acciones">
                        <button type="button" id="vaciar-carrito" class="btn btn-vaciar">Vaciar carrito</button>
                        <button type="button" id="finalizar-compra" class="btn bg-secondary text-dark">Finalizar compra</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>Sitio realizado por Luis para Talento Tech</p>
        <nav>
            <ul class="footer-list">
                <li>
                    <img src="../img/whatsapp.png" alt="logo whatsapp" />
                    <img src="../img/instagram.png" alt="logo instagram" />
                </li>
            </ul>
        </nav>
    </footer>
    <script src="../js/storage.js" defer></script>
    <script src="../js/actualizar_carrito.js" defer></script>
    <script src="../js/agregar_carrito.js" defer></script>
    <script src="../js/carrito.js" defer></script>
</body>
</html>
